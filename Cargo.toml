[package]
name = "summoner"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Thomas Gardiner"]
description = "A small, provider-neutral agent harness"
readme = "README.md"
repository = "https://github.com/thomgardiner/summoner"
homepage = "https://github.com/thomgardiner/summoner"
publish = false

[[bin]]
name = "summon"
path = "src/main.rs"

[[bin]]
name = "summoner"
path = "src/summoner.rs"

[dependencies]
base64 = "0.22"
futures = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol_str = { version = "0.3.6", default-features = false }
thiserror = "2"
tempfile = "3"
toml = "0.8"
toml_edit = "0.22"
unicode-width = "0.2"
unicode-segmentation = "1.13.3"
uuid = { version = "1.24", features = ["v7"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "stream", "native-tls"] }
genai = { version = "=0.7.0-beta.23", default-features = false, features = ["native-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
crossterm = "0.29"
sigil = { package = "sigil-ui", git = "ssh://git@github.com/ThomGardiner/sigil.git", rev = "c99ae1e493c7e1b13647952ef68b2df409e4112a", default-features = false, features = ["tui", "clipboard-image"] }
sigil-hal = { git = "ssh://git@github.com/ThomGardiner/sigil.git", rev = "c99ae1e493c7e1b13647952ef68b2df409e4112a" }
sigil-tui = { git = "ssh://git@github.com/ThomGardiner/sigil.git", rev = "c99ae1e493c7e1b13647952ef68b2df409e4112a" }
sigil-ide-core = { git = "ssh://git@github.com/ThomGardiner/sigil.git", rev = "c99ae1e493c7e1b13647952ef68b2df409e4112a" }
chacha20poly1305 = "0.10"

[dev-dependencies]
vt100 = "=0.16.2"

[patch.crates-io]
crossterm = { git = "https://github.com/eitsupi/crossterm.git", rev = "94ed7154e35d24a2f643c61760e1eb05b8ca9e63" }

[features]
default = []
# `summon --gui`: the same panes in a winit + wgpu window.
gui = ["sigil/clipboard", "sigil/desktop"]

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
dunce = "1.0"
process-wrap = { version = "9.1", default-features = false, features = ["job-object", "tokio1"] }
winapi-util = "0.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_StationsAndDesktops", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
rc_mutex = "deny"
unused_result_ok = "deny"
allow_attributes_without_reason = "deny"
let_underscore_future = "deny"
let_underscore_lock = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
assertions_on_result_states = "deny"
unwrap_in_result = "deny"
get_unwrap = "deny"
ignore_without_reason = "deny"
should_panic_without_expect = "deny"
