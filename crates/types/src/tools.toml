[[tool]]
kind = "read"
claude = "Read"
acp_kind = "read"
verb = "Read"
readonly = true
advertise = "always"
run = "always"
description = "Read files (N:text; offset/limit, widened by before/after/context; paths[] for several; tags true adds hash tags for tag-edits), list directories as a tree, or view an image file. op=help returns the full reference."
help = """read op reference: every form honors ignore rules unless no_ignore is true; search files with the search tool.

op=file (default with path): N:text lines, one page of up to {read_page_kib} KiB by default; offset starts at line N, limit caps lines (max {read_line_limit}); paths[] shares the page budget across files, reports missing ones inline, and gives each truncated file its own continuation offset; tags true adds hash tags for tag-edits.
op=list: directory listing; recursive true or depth N returns a tree; truncation notes say how to narrow.
op=image: returns the image so you can see it; a model without image input gets a description or a note instead."""

[tool.schema]
type = "object"
additionalProperties = false

[tool.schema.properties]
path = { type = "string" }
offset = { type = "integer", minimum = 1 }
limit = { type = "integer", minimum = 1, maximum = { fill = "read_line_limit" } }
paths = { type = "array", items = { type = "string" } }
before = { type = "integer", minimum = 0, maximum = 10 }
after = { type = "integer", minimum = 0, maximum = 10 }
context = { type = "integer", minimum = 0, maximum = 10 }
tags = { type = "boolean" }
recursive = { type = "boolean" }
depth = { type = "integer", minimum = 1 }
op = { type = "string", enum = ["file", "list", "image", "help"] }

[[tool]]
kind = "search"
claude = "Grep"
claude_aliases = ["Glob"]
acp_kind = "search"
verb = "Search"
readonly = true
advertise = "always"
run = "always"
description = "Find text in files (pattern) or files by name (name, glob), anywhere on disk; use it instead of grep, rg, or find. Newest first; secret files are never read. op=help lists the other options."
help = """search reference: case is ignored unless case_sensitive is true; a call returns what it found after {search_secs}s.

- pattern: regex over file contents, a|b for alternatives; literal true takes it as plain text; word true matches whole words
- name: words that must all appear in the file name, any order ("q3 report"); glob: a file pattern such as *.rs or src/**/*.ts; with pattern, both narrow the files searched
- path: folder or file to search; ~ and absolute paths work; default the workspace; depth N limits folder levels; no_ignore true includes gitignored files and build folders
- output: lines (default) shows matches, files lists matching files, count counts per file, folders counts files per folder; context N adds lines around each match (max {search_context_max})
- newer: only files changed within 30m, 2h, 3d, or 2w
- limit: results to return (default {search_default}, max {search_max}); offset skips files for the next page; tags true prints N:hash tags that edit takes"""

[tool.schema.properties]
pattern = { type = "string" }
name = { type = "string" }
glob = { type = "string" }
path = { type = "string" }
output = { type = "string", enum = ["lines", "files", "count", "folders"] }
context = { type = "integer", minimum = 0, maximum = { fill = "search_context_max" } }
literal = { type = "boolean" }
limit = { type = "integer", minimum = 1, maximum = { fill = "search_max" } }
op = { type = "string", enum = ["help"] }

[[tool]]
kind = "edit"
claude = "Edit"
claude_aliases = ["MultiEdit", "NotebookEdit"]
acp_kind = "edit"
verb = "Edit"
readonly = false
advertise = "always"
run = "always"
description = "Edit existing files with old+new, edits[], or checked replacements in files[]. expected_matches checks the exact occurrence count; preview true shows the changes without writing. path+to moves a file without staging Git changes. Tags from read disambiguate ranges. New or empty files: write. op=help gives the grammar."
help = """edit grammar: tags are N:hash strings that a read with tags true returns.

- old+new: replace the unique substring (replace_all true replaces every occurrence); expected_matches requires that exact count and replaces those occurrences; without it a whitespace-only mismatch self-corrects and says so
- tag+new: replace the tagged line(s), end_tag extends the range
- tag+text: insert after the tagged line
- op=delete: remove tagged lines
- edits[]: apply several of the above atomically; if two overlap they apply in order, each against the result of the one before
- op=sequence: resolve edits in order
- patch: a full *** Begin Patch / Update|Add|Delete File document with @@ context lines; multiple files per document; every file is staged first, so a failed stage changes nothing
- path+to: rename or move the file; an existing destination is rejected; Git's index is not changed
- files[]: checked replacements in explicit files, each with path, old, new, and expected_matches; all files are validated before any writes; duplicate paths are rejected
- preview true: validate and show the replacement diffs or move without writing or running diagnostics
New or empty files: use write."""

[tool.schema]
type = "object"
additionalProperties = false

[tool.schema.properties]
path = { type = "string" }
old = { type = "string" }
new = { type = "string" }
tag = { type = "string" }
text = { type = "string" }
replace_all = { type = "boolean" }
expected_matches = { type = "integer", minimum = 1 }
to = { type = "string" }
preview = { type = "boolean" }
op = { type = "string", enum = ["delete", "sequence", "help"] }

[tool.schema.properties.edits]
type = "array"
minItems = 1

[tool.schema.properties.edits.items]
type = "object"
additionalProperties = false

[tool.schema.properties.edits.items.properties]
old = { type = "string" }
new = { type = "string" }
tag = { type = "string" }
text = { type = "string" }
replace_all = { type = "boolean" }
expected_matches = { type = "integer", minimum = 1 }
op = { type = "string", enum = ["delete"] }

[tool.schema.properties.files]
type = "array"
minItems = 1

[tool.schema.properties.files.items]
type = "object"
additionalProperties = false
required = ["path", "old", "new", "expected_matches"]

[tool.schema.properties.files.items.properties]
path = { type = "string" }
old = { type = "string" }
new = { type = "string" }
expected_matches = { type = "integer", minimum = 1 }

