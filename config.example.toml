default = "anthropic"

[provider.zai]
region = "cn"
access = "plan"

[endpoint.zai-cn]
model = "glm-5.3"

[endpoint.local]
base_url = "http://127.0.0.1:8080/v1"
model = "qwen3"
api_key = "local"
reasoning_levels = ["low", "medium", "high"]
thinking_off = "chat_template_kwargs"
[endpoint.local.body]
temperature = 0.6
top_p = 0.95

[endpoint.local.models.qwen3.body]
top_k = 20

[endpoint.kimi]
base_url = "https://api.kimi.com/coding/v1"
model = "k3"

[endpoint.grok]
base_url = "https://api.x.ai/v1"
model = "grok-4.6"
