[apply_patch]
description = "Create, change, move, or delete files with one patch. The patch text is:\n*** Begin Patch\n*** Update File: path/to/file\n*** Move to: path/to/destination\n@@ optional line that sits above the change\n context line\n-removed line\n+added line\n*** Add File: path/to/new\n+every line of the new file\n*** Delete File: path/to/old\n*** End Patch\nMove to is optional and must follow Update File immediately; omit hunks for a move without edits. An existing destination is rejected. Update hunks need about three unchanged context lines around each change. All sections are validated before writes. Git's index is not changed. Use edit for checked multi-file replacements and previews."

[apply_patch.schema]
type = "object"
properties = { patch = { type = "string" } }
required = ["patch"]
additionalProperties = false

