n_attempts: 1
n_concurrent_trials: 6
timeout_multiplier: 1.0
environment:
  import_path: image_user:Docker
  kwargs: {extra_hosts: "host.docker.internal:host-gateway"}
agents:
  - import_path: pi_agent:Pi
    n_concurrent: 1
    override_timeout_sec: 21600
    model_name: zai/glm-5.3-flash
    kwargs: {version: "${pi}", reasoning_effort: max}
    env: {ZAI_API_KEY: "$${ZAI_API_KEY}", BENCH_BASE: "${BENCH_PROXY}/pi/v1"}
  - import_path: hermes_agent:HermesCli
    n_concurrent: 1
    override_timeout_sec: 21600
    model_name: zai/glm-5.3-flash
    kwargs: {version: "${hermes}", reasoning_effort: max}
    env: {ZAI_API_KEY: "$${ZAI_API_KEY}", BENCH_BASE: "${BENCH_PROXY}/hermes/v1", GLM_BASE_URL: "${BENCH_PROXY}/hermes/v1"}
  - import_path: opencode2_agent:OpenCode2
    n_concurrent: 1
    override_timeout_sec: 21600
    model_name: zai/glm-5.3-flash
    kwargs: {version: "${opencode2}", variant: max}
    env: {ZHIPU_API_KEY: "$${ZAI_API_KEY}", BENCH_BASE: "${BENCH_PROXY}/opencode2/v1"}
  - import_path: omp_agent:Omp
    n_concurrent: 1
    override_timeout_sec: 21600
    model_name: zai/glm-5.3-flash
    kwargs: {version: "${omp}", bun: "${bun}", reasoning_effort: max}
    env: {ZAI_API_KEY: "$${ZAI_API_KEY}", BENCH_BASE: "${BENCH_PROXY}/omp/v1"}
  - import_path: summonr_agent:Summonr
    n_concurrent: 1
    override_timeout_sec: 21600
    model_name: zai/glm-5.3-flash
    kwargs: {binary: "${SUMMONR}", binary_sha256: "${SUMMONR_SHA256}", reasoning_effort: max}
    env: {ZAI_API_KEY: "$${ZAI_API_KEY}", BENCH_KEY: "$${ZAI_API_KEY}", BENCH_BASE: "${BENCH_PROXY}/summonr/v1"}
  - import_path: summonr_agent:SummonrControl
    n_concurrent: 1
    override_timeout_sec: 21600
    model_name: zai/glm-5.3-flash
    kwargs: {binary: "${SUMMONR}", binary_sha256: "${SUMMONR_SHA256}", reasoning_effort: max}
    env: {ZAI_API_KEY: "$${ZAI_API_KEY}", BENCH_KEY: "$${ZAI_API_KEY}", BENCH_BASE: "${BENCH_PROXY}/summonr-control/v1"}
datasets:
  - {name: terminal-bench/terminal-bench-2-1, ref: latest}
