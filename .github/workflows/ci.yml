name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: workflow lint
        run: |
          docker build --tag ci-actionlint .github/actionlint
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo ci-actionlint
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: formatting
        run: cargo fmt --all -- --check
      - name: API limits
        run: python3 scripts/api-census.py --check
      - name: palette
        run: python3 scripts/palette-check.py
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d
        with:
          tool: cargo-deny@0.20.2
      - name: supply chain
        run: cargo deny check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.event_name == 'push' }}
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test --workspace --locked --no-fail-fast

  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: line endings
        run: git config --global core.autocrlf false
      - name: real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.event_name == 'push' }}
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads=2

  macos:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.event_name == 'push' }}
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test --workspace --locked --no-fail-fast

  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            libc: musl
          - os: ubuntu-24.04
            libc: gnu
          - os: ubuntu-24.04-arm
            libc: musl
          - os: ubuntu-24.04-arm
            libc: gnu
          - os: macos-14
          - os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: install the latest release with this checkout's installer
        if: runner.os != 'Windows'
        shell: bash
        env:
          SUMMONR_LIBC: ${{ matrix.libc || 'musl' }}
        run: |
          dir="$RUNNER_TEMP/summonr-bin"
          SUMMONR_INSTALL_DIR="$dir" sh scripts/install.sh
          "$dir/summonr" --version
          "$dir/summonr" update
      - name: install the latest release with this checkout's installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SUMMONR_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'summonr-bin'
          ./scripts/install.ps1
          $exe = Join-Path $env:SUMMONR_INSTALL_DIR 'summonr.exe'
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  required:
    if: always()
    needs: [ci, windows, macos, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every platform passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a platform job ended with $result" >&2
              exit 1
            fi
          done
