name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: formatting
        run: cargo fmt --all -- --check
      - name: API limits
        run: python3 scripts/api-census.py --check
      - name: palette
        run: python3 scripts/palette-check.py
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: 'false'
      - name: clippy
        run: cargo clippy -p summonr --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test --workspace --locked

  macos:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: 'false'
      - name: tests
        run: cargo test --workspace --locked

  build:
    name: build ${{ matrix.target }}
    needs: [test, macos]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            apt: musl-tools
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            apt: musl-tools
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: system packages
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}
      - name: Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
      - name: fetch dependencies
        run: cargo fetch --locked
      - name: build
        run: cargo build --release --locked -p summonr --bin summonr --target ${{ matrix.target }}
      - name: package
        id: package
        run: |
          name="summonr-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"
          mkdir -p dist "stage/$name"
          cp README.md LICENSE CHANGELOG.md "stage/$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$dir/summonr.exe" "stage/$name/"
            asset="$name.zip"
            (cd stage && 7z a -tzip "../dist/$asset" "$name" >/dev/null)
          else
            cp "$dir/summonr" "stage/$name/"
            asset="$name.tar.gz"
            tar -C stage -czf "dist/$asset" "$name"
          fi
          (cd dist && if command -v sha256sum >/dev/null; then sha256sum "$asset"; else shasum -a 256 "$asset"; fi) > "dist/$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.target }}: $asset $(cut -d' ' -f1 "dist/$asset.sha256")" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/${{ steps.package.outputs.asset }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: summonr-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; split($2, h, /[ \t]/); if (h[1] == v || h[1] == "[" v "]") { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          case $TAG in
            *-*)
              flags=(--draft --prerelease)
              [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
              ;;
            *)
              flags=(--draft=false --prerelease=false --latest)
              if ! grep -q '[^[:space:]]' notes.md; then
                echo "CHANGELOG.md has no section for $version" >&2
                exit 1
              fi
              ;;
          esac
          (cd dist && cat ./*.sha256 > SHA256SUMS)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md "${flags[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md "${flags[@]}" dist/*
          fi
