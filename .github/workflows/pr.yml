name: PR

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  pr:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: private git deps
        id: deps
        env:
          TOKEN: ${{ secrets.CI_CROSS_REPO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:$TOKEN@github.com/".insteadOf "https://github.com/"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "CI_CROSS_REPO_TOKEN is not set: private dependencies cannot be fetched, so clippy and tests did not run here. The pre-push hook runs them before each push." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Select affected packages
        id: scope
        if: steps.deps.outputs.ok == 'true'
        run: |
          pkgs=$(node scripts/affected-packages.mjs \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --explain)
          args=""
          for p in $pkgs; do args="$args -p $p"; done
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "scope: ${args:-none (docs or non-Rust change)}" >> "$GITHUB_STEP_SUMMARY"
      - name: fetch dependencies, then drop the token
        if: steps.scope.outputs.args != ''
        run: |
          cargo fetch --locked
          git config --global --get-regexp '^url\..*\.insteadof$' | cut -d' ' -f1 | while read -r key; do
            git config --global --unset-all "$key"
          done
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.scope.outputs.args != ''
        with:
          save-if: 'false'
      - name: cargo clippy
        if: steps.scope.outputs.args != ''
        run: cargo clippy ${{ steps.scope.outputs.args }} --all-targets --locked --no-deps -- -D warnings
      - name: cargo test
        if: steps.scope.outputs.args != ''
        run: cargo test ${{ steps.scope.outputs.args }} --locked
