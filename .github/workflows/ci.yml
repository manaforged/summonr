name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  check:
    if: github.repository == 'manaforged/summonr' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: formatting and repo checks
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          python3 scripts/api-census.py --check
          python3 scripts/palette-check.py
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d
        if: runner.os == 'Linux'
        with:
          tool: cargo-deny@0.20.2
      - name: supply chain
        if: runner.os == 'Linux'
        run: cargo deny check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: false
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test --workspace --locked --no-fail-fast ${{ runner.os == 'Windows' && '-- --test-threads=2' || '' }}
