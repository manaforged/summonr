name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: workflow lint
        run: |
          docker build --tag ci-actionlint .github/actionlint
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo ci-actionlint
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: formatting
        run: cargo fmt --all -- --check
      - name: API limits
        run: python3 scripts/api-census.py --check
      - name: palette
        run: python3 scripts/palette-check.py
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.event_name == 'push' }}
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test --workspace --locked --no-fail-fast

  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: line endings
        run: git config --global core.autocrlf false
      - name: real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.event_name == 'push' }}
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads=2

  macos:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.event_name == 'push' }}
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test --workspace --locked --no-fail-fast

  required:
    if: always()
    needs: [ci, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every platform passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a platform job ended with $result" >&2
              exit 1
            fi
          done
