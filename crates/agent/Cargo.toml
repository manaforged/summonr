[package]
name = "summonr-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
build = "build.rs"

[dependencies]
summonr-auth = { path = "../auth" }
summonr-core = { path = "../core" }
summonr-types = { path = "../types" }
base64 = { workspace = true }
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
regex = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
zeroize = "1"
toml = { workspace = true }
toml_edit = "0.22"
unicode-segmentation = "1.13.3"
unicode-width = "0.2"
uuid = { version = "1.24", features = ["v7"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
charm-cdp = { git = "https://github.com/manaforged/charm", rev = "3a9a351c5dfd8b76f509fa32adbe97978fd0aaa0" }
leyline = { workspace = true }
url = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ignore = { workspace = true }
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
unicode-normalization = "0.1"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
chacha20poly1305 = "0.10"
libc = "0.2"
dunce = { workspace = true }
jiff = "0.2.38"
httparse = "1.10"
fastrand = "2.5"

[dev-dependencies]
summonr-core = { path = "../core", features = ["test-home"] }
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "9.1", default-features = false, features = ["job-object", "tokio1"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[lints]
workspace = true
