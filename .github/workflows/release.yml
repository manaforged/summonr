name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            experimental: false
          - target: x86_64-apple-darwin
            os: macos-14
            experimental: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            experimental: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            experimental: false
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            experimental: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
      - name: fetch dependencies
        env:
          TOKEN: ${{ secrets.CI_CROSS_REPO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:$TOKEN@github.com/".insteadOf "https://github.com/"
          fi
          cargo fetch --locked
          git config --global --get-regexp '^url\..*\.insteadof$' | cut -d' ' -f1 | while read -r key; do
            git config --global --unset-all "$key"
          done
      - name: build
        run: cargo build --release --locked -p summonr --bin summonr --target ${{ matrix.target }}
      - name: package
        id: package
        run: |
          name="summonr-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"
          mkdir -p dist "stage/$name"
          cp README.md LICENSE CHANGELOG.md "stage/$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$dir/summonr.exe" "stage/$name/"
            asset="$name.zip"
            (cd stage && 7z a -tzip "../dist/$asset" "$name" >/dev/null)
          else
            cp "$dir/summonr" "stage/$name/"
            asset="$name.tar.gz"
            tar -C stage -czf "dist/$asset" "$name"
          fi
          (cd dist && if command -v sha256sum >/dev/null; then sha256sum "$asset"; else shasum -a 256 "$asset"; fi) > "dist/$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.target }}: $asset $(cut -d' ' -f1 "dist/$asset.sha256")" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: summonr-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            prerelease=""
            case $TAG in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft $prerelease --title "$TAG" --notes "See CHANGELOG.md."
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*
