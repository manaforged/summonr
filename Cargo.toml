[package]
name = "summonr"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Manaforge Technologies LLC"]
description = "Terminal coding agent in Rust"
readme = "README.md"
repository = "https://github.com/manaforged/summonr"
homepage = "https://summonr.dev"
keywords = ["agent", "llm", "cli", "tui", "coding-assistant"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[workspace]
members = ["crates/agent", "crates/auth", "crates/core", "crates/types", "crates/ui", "desktop"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Manaforge Technologies LLC"]

[[bin]]
name = "summonr"
path = "src/bin/summonr.rs"

[[test]]
name = "mcp"
harness = false

[workspace.dependencies]
base64 = "0.22"
leyline = { package = "leyline-http", version = "0.2.0", default-features = false, features = ["charset", "compression-brotli", "compression-deflate", "compression-gzip", "compression-zstd"] }
rand = { version = "0.9", default-features = false, features = ["os_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
url = "2"
dunce = "1.0"
ignore = "0.4"
regex = "1"
toml = "0.8"

[dependencies]
summonr-agent = { path = "crates/agent" }
summonr-auth = { path = "crates/auth" }
summonr-core = { path = "crates/core" }
summonr-ui = { path = "crates/ui" }
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
leyline = { workspace = true }
crossterm = "0.29"
libc = "0.2"
dunce = { workspace = true }
jiff = "0.2.38"

[dev-dependencies]
summonr-core = { path = "crates/core", features = ["test-home"] }
uuid = { version = "1.24", features = ["v7"] }
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dev-dependencies]
portable-pty = "0.9"
vt100 = "0.16"

[patch.crates-io]
crossterm = { git = "https://github.com/manaforged/crossterm.git", rev = "5b1788b58b5d18237ed11f049717975f3168483e" }

[features]
default = []
gui = ["summonr-ui/gui"]
menu = ["gui", "summonr-ui/menu"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.profiling]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = "line-tables-only"
strip = "none"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
unreachable_pub = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
rc_mutex = "deny"
unused_result_ok = "deny"
allow_attributes_without_reason = "deny"
let_underscore_future = "deny"
let_underscore_lock = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
assertions_on_result_states = "deny"
unwrap_in_result = "deny"
get_unwrap = "deny"
ignore_without_reason = "deny"
should_panic_without_expect = "deny"
