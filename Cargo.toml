[package]
name = "summonr"
version = "0.1.0"
edition = "2024"
rust-version = "1.98" # MSRV: matches rust-toolchain.toml
license = "MIT"
authors = ["Thomas Gardiner"]
description = "Terminal coding agent in Rust"
readme = "README.md"
repository = "https://github.com/manaforged/summonr"
homepage = "https://summonr.dev"
publish = false

[workspace]
members = ["crates/auth"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Thomas Gardiner"]

[[bin]]
name = "summonr"
path = "src/main.rs"

[workspace.dependencies]
base64 = "0.22"
leyline = { package = "leyline-http", git = "https://github.com/manaforged/leyline-http", branch = "main", default-features = false, features = ["charset", "compression-brotli", "compression-deflate", "compression-gzip", "compression-zstd", "cookies", "stream", "system-trust"] }
rand = { version = "0.9", default-features = false, features = ["os_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
url = "2"

[dependencies]
summonr-auth = { path = "crates/auth" }
base64 = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol_str = { version = "0.3.6", default-features = false }
thiserror = "2"
tempfile = "3"
zeroize = "1"
toml = "0.8"
toml_edit = "0.22"
unicode-segmentation = "1.13.3"
unicode-linebreak = "0.1.5"
uuid = { version = "1.24", features = ["v7"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "stream", "native-tls-vendored"] }
leyline-http = { git = "https://github.com/manaforged/leyline-http", branch = "main", default-features = false, features = ["charset", "compression-brotli", "compression-deflate", "compression-gzip", "compression-zstd", "cookies", "stream", "system-trust"] }
url = { workspace = true }
genai = { version = "=0.7.0-beta.23", default-features = false, features = ["native-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
crossterm = "0.29"
sigil = { package = "sigil-gui", git = "https://github.com/manaforged/sigil.git", branch = "main", default-features = false, features = ["clipboard-image"] }
sigil-tui = { git = "https://github.com/manaforged/sigil.git", branch = "main" }
ignore = "0.4"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
chacha20poly1305 = "0.10"

[patch.crates-io]
crossterm = { git = "https://github.com/eitsupi/crossterm.git", rev = "94ed7154e35d24a2f643c61760e1eb05b8ca9e63" }

[features]
default = []
# `summonr --gui`: the same panes in a winit + wgpu window.
gui = ["sigil/clipboard", "sigil/desktop"]

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(windows)'.dependencies]
dunce = "1.0"
process-wrap = { version = "9.1", default-features = false, features = ["job-object", "tokio1"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_StationsAndDesktops", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
rc_mutex = "deny"
unused_result_ok = "deny"
allow_attributes_without_reason = "deny"
let_underscore_future = "deny"
let_underscore_lock = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
assertions_on_result_states = "deny"
unwrap_in_result = "deny"
get_unwrap = "deny"
ignore_without_reason = "deny"
should_panic_without_expect = "deny"
