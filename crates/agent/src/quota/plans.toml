[[plan]]
name = "ChatGPT"
via = "https://auth.openai.com/"
url = "https://chatgpt.com/backend-api/wham/usage"
shape = "wham"

[[plan]]
name = "Codex"
installed = "codex"
url = "https://chatgpt.com/backend-api/wham/usage"
token = { file = "~/.codex/auth.json", pointer = "/tokens/access_token" }
headers = { "ChatGPT-Account-Id" = { file = "~/.codex/auth.json", pointer = "/tokens/account_id" } }
shape = "wham"

[[plan]]
name = "Claude Code"
os = "macos"
installed = "claude"
url = "https://api.anthropic.com/api/oauth/usage"
token = { command = ["security", "find-generic-password", "-s", "Claude Code-credentials", "-w"], pointer = "/claudeAiOauth/accessToken" }
headers = { "anthropic-beta" = "oauth-2025-04-20", "User-Agent" = "claude-cli (external, cli)" }
shape = "claude"

[[plan]]
name = "Claude Code"
os = "linux"
installed = "claude"
url = "https://api.anthropic.com/api/oauth/usage"
token = { file = "~/.claude/.credentials.json", pointer = "/claudeAiOauth/accessToken" }
headers = { "anthropic-beta" = "oauth-2025-04-20", "User-Agent" = "claude-cli (external, cli)" }
shape = "claude"

[[plan]]
name = "Antigravity"
command = ["agy", "-p", "/usage", "--output-format", "json"]
env = { AGY_CLI_DISABLE_AUTO_UPDATE = "true" }
shape = "antigravity"

[[plan]]
name = "GLM coding plan"
via = "https://open.bigmodel.cn/api/coding/"
url = "https://open.bigmodel.cn/api/monitor/usage/quota/limit"
shape = "zai"

[[plan]]
name = "GLM coding plan"
via = "https://api.z.ai/api/coding/"
url = "https://api.z.ai/api/monitor/usage/quota/limit"
shape = "zai"
