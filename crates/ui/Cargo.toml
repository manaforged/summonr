[package]
name = "summonr-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
summonr-agent = { path = "../agent" }
summonr-auth = { path = "../auth" }
summonr-core = { path = "../core" }
crossterm = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
regex = { workspace = true }
serde_json = { workspace = true }
sigil = { package = "sigil-ui", version = "0.2.0", default-features = false, features = ["terminal", "inspect"] }
tempfile = "3"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = { workspace = true }
toml_edit = "0.22"
unicode-segmentation = "1.13.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
sigil = { package = "sigil-ui", version = "0.2.0", default-features = false, features = ["kittest"] }
summonr-core = { path = "../core", features = ["test-home"] }
tokio = { version = "1", features = ["test-util"] }

[features]
default = []
gui = ["sigil/native-dialog", "sigil/pty", "sigil/notify"]
menu = ["gui", "sigil/menu"]

[lints]
workspace = true
