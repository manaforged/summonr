n_attempts: 3
n_concurrent_trials: 4
timeout_multiplier: 1.0
environment:
  import_path: image_user:Docker
  mounts:
    - {type: bind, source: "${LOGINS}/.summonr", target: /opt/auth/summonr}
agents:
  - name: codex
    n_concurrent: 2
    model_name: openai/gpt-6.1-sol
    kwargs: {version: "${codex}", reasoning_effort: high}
    env: {CODEX_AUTH_JSON_PATH: "$${CODEX_AUTH_JSON_PATH}"}
  - import_path: summonr_agent:Summonr
    n_concurrent: 2
    model_name: openai/gpt-6.1-sol
    kwargs: {binary: "${SUMMONR}", binary_sha256: "${SUMMONR_SHA256}", reasoning_effort: high}
datasets:
  - {name: terminal-bench/terminal-bench, ref: "4.0.0"}
