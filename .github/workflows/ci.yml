name: CI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: workflow lint
        run: |
          docker build --tag ci-actionlint .github/actionlint
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo ci-actionlint
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: formatting
        run: cargo fmt --all -- --check
      - name: API limits
        run: python3 scripts/api-census.py --check
      - name: palette
        run: python3 scripts/palette-check.py
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.event_name == 'push' }}
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
