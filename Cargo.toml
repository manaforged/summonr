[package]
name = "summoner"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Thomas Gardiner"]
description = "A small, provider-neutral agent harness"
readme = "README.md"
repository = "https://github.com/thomgardiner/summoner"
homepage = "https://github.com/thomgardiner/summoner"
publish = false

[[bin]]
name = "summon"
path = "src/main.rs"

[[bin]]
name = "summoner"
path = "src/summoner.rs"

[dependencies]
base64 = "0.22"
cap-std = "4.0.2"
futures = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
toml = "0.8"
toml_edit = "0.22"
unicode-width = "0.2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "stream", "native-tls"] }
genai = { version = "0.6.5", default-features = false, features = ["native-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
crossterm = "0.28"
sigil = { package = "sigil-ui", git = "ssh://git@github.com/ThomGardiner/sigil.git", rev = "5c74ed9fb2aad49bfdb3b12205c221fd4c8c28fc", default-features = false, features = ["tui"] }
sigil-hal = { git = "ssh://git@github.com/ThomGardiner/sigil.git", rev = "5c74ed9fb2aad49bfdb3b12205c221fd4c8c28fc" }
sigil-tui = { git = "ssh://git@github.com/ThomGardiner/sigil.git", rev = "5c74ed9fb2aad49bfdb3b12205c221fd4c8c28fc" }
sigil-ide-core = { git = "ssh://git@github.com/ThomGardiner/sigil.git", rev = "5c74ed9fb2aad49bfdb3b12205c221fd4c8c28fc" }
chacha20poly1305 = "0.10"

[features]
default = []
# `summon --gui`: the same panes in a winit + wgpu window.
gui = ["sigil/clipboard", "sigil/desktop"]

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
rc_mutex = "deny"
unused_result_ok = "deny"
allow_attributes_without_reason = "deny"
let_underscore_future = "deny"
let_underscore_lock = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
assertions_on_result_states = "deny"
unwrap_in_result = "deny"
get_unwrap = "deny"
ignore_without_reason = "deny"
should_panic_without_expect = "deny"
