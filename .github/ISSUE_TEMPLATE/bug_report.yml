name: Bug report
description: Report something that does not work as documented.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `summonr --version`.
      placeholder: summonr 0.1.0 (abcdef123456)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: macOS 15.5 arm64
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Provider and model
      placeholder: anthropic / claude-sonnet
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `summonr ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run `summonr doctor --logs` and attach the relevant run log. Remove API keys and other secrets first.
      render: text
